name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0 or v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Accept 0.2.0 or v0.2.0; the binary always reports the bare semver.
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$' ; then
            echo 'version must look like 0.2.0 or v0.2.0' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          suffix=''
          if [ "$GOOS" = 'windows' ]; then suffix='.exe'; fi
          mkdir -p dist
          ldflags="-s -w -X github.com/uniproxy/uniproxy/internal/version.Version=${VERSION} -X github.com/uniproxy/uniproxy/internal/version.Commit=${COMMIT} -X github.com/uniproxy/uniproxy/internal/version.Date=${BUILD_DATE}"
          go build -trimpath -ldflags "$ldflags" -o "dist/uniproxy-${GOOS}-${GOARCH}${suffix}" ./cmd/uniproxy
          go build -trimpath -ldflags "$ldflags" -o "dist/core-install-${GOOS}-${GOARCH}${suffix}" ./cmd/core-install
      - uses: actions/upload-artifact@v4
        with:
          name: uniproxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Uses the runner's preinstalled gh CLI instead of a third-party release
      # action, so publishing adds no extra supply-chain dependency.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            RAW="${{ inputs.version }}"
            TAG="v${RAW#v}"
            TITLE="UniProxy ${TAG#v}"
            # A manual run has no pushed tag yet, so create it on this commit.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
          else
            TAG="${{ github.ref_name }}"
            TITLE="UniProxy ${TAG#v}"
            # A tag push must point at a real existing tag, never a typo.
            gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --generate-notes
          fi
